name: AI PR Review

on:
  workflow_call:
    inputs:
      reviewer-repo:
        description: "The repo containing review_bot.py, as owner/repo@ref"
        required: false
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Check out the reviewer repo (where review_bot.py lives).
      # Falls back to the repo that owns this workflow file if no override given.
      - name: Check out reviewer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.reviewer-repo != '' && inputs.reviewer-repo || github.repository }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run AI reviewer
        run: python review_bot.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
