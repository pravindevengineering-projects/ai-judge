  name: AI PR Review
  on:
    pull_request:

  jobs:
    ai-review:
      uses: pravindevengineering-projects/ai-judge/.github/workflows/ai-review.yml@main
      permissions:
        contents: read
        pull-requests: write
      with:
        reviewer-repo: pravindevengineering-projects/ai-judge
      secrets:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  EOF

