name: AI PR Review

on:
  workflow_call:
    inputs:
      reviewer-repo:
        description: "The repo containing review_bot.py, as owner/repo"
        type: string
        required: false
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
      AI_JUDGE_WRITE_TOKEN:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out reviewer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.reviewer-repo || github.repository }}
          token: ${{ secrets.AI_JUDGE_WRITE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run AI reviewer
        run: python review_bot.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-west-2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit review log
        run: |
          if [ -z "$AI_JUDGE_WRITE_TOKEN" ]; then
            echo "AI_JUDGE_WRITE_TOKEN not configured; skipping log commit."
            exit 0
          fi
          git config user.name "ai-judge[bot]"
          git config user.email "ai-judge[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${AI_JUDGE_WRITE_TOKEN}@github.com/${{ inputs.reviewer-repo || github.repository }}.git"
          git add review_log.csv
          git diff --cached --quiet || git commit -m "chore: log review for ${{ github.repository }}#${{ github.event.pull_request.number }}"
          git push
        env:
          AI_JUDGE_WRITE_TOKEN: ${{ secrets.AI_JUDGE_WRITE_TOKEN }}
