name: AI PR Review

on:
  workflow_call:
    inputs:
      reviewer-repo:
        description: "The repo containing review_bot.py, as owner/repo"
        type: string
        required: false
        default: ""
      reviewer-ref:
        description: "Tag or branch of the reviewer repo to run (pin to the same tag as the workflow, e.g. v1)"
        type: string
        required: false
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
      AI_JUDGE_WRITE_TOKEN:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out reviewer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.reviewer-repo || github.repository }}
          ref: ${{ inputs.reviewer-ref }}
          token: ${{ secrets.AI_JUDGE_WRITE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run AI reviewer
        run: python review_bot.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-west-2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_JUDGE_LOG_FILE: review_row.csv

      - name: Upload review log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-log
          path: review_row.csv
          if-no-files-found: warn
          retention-days: 365

      - name: Append review row to cumulative log in ai-judge repo
        continue-on-error: true
        run: |
          if [ -z "$AI_JUDGE_WRITE_TOKEN" ]; then
            echo "AI_JUDGE_WRITE_TOKEN not configured; skipping log commit."
            exit 0
          fi
          if [ ! -f review_row.csv ]; then
            echo "No review row produced; nothing to log."
            exit 0
          fi
          # Concurrent runs from many repos race on the same file: re-clone and retry.
          for attempt in 1 2 3 4 5; do
            rm -rf _log
            git clone --quiet --depth 1 "https://x-access-token:${AI_JUDGE_WRITE_TOKEN}@github.com/${REVIEWER_REPO}.git" _log
            if [ -f _log/review_log.csv ]; then
              tail -n +2 review_row.csv >> _log/review_log.csv
            else
              cp review_row.csv _log/review_log.csv
            fi
            git -C _log add review_log.csv
            git -C _log -c user.name="ai-judge[bot]" -c user.email="ai-judge[bot]@users.noreply.github.com" \
              commit --quiet -m "chore: log review for ${{ github.repository }}#${{ github.event.pull_request.number }}"
            if git -C _log push --quiet; then
              echo "Logged on attempt $attempt."
              exit 0
            fi
            sleep $(( attempt * 3 + RANDOM % 5 ))
          done
          echo "::warning::Could not push review log after 5 attempts."
        env:
          AI_JUDGE_WRITE_TOKEN: ${{ secrets.AI_JUDGE_WRITE_TOKEN }}
          REVIEWER_REPO: ${{ inputs.reviewer-repo || github.repository }}
